<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="LMS-Bridge">
  <defs>
    <linearGradient id="gi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cf7"/>
      <stop offset="1" stop-color="#5a4be8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="23" fill="url(#gi)"/>
  <!-- deck -->
  <line x1="17" y1="64" x2="79" y2="64" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- piers -->
  <line x1="18" y1="64" x2="18" y2="75" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <line x1="78" y1="64" x2="78" y2="75" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- arch -->
  <path d="M18 64 Q48 22 78 64" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- cables -->
  <line x1="32" y1="49.5" x2="32" y2="64" stroke="#c7bffb" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="48" y1="43"   x2="48" y2="64" stroke="#c7bffb" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="64" y1="49.5" x2="64" y2="64" stroke="#c7bffb" stroke-width="3.4" stroke-linecap="round"/>
  <!-- progress node crossing the bridge -->
  <circle cx="48" cy="35" r="6.4" fill="#ffffff"/>
  <circle cx="48" cy="35" r="6.4" fill="none" stroke="#e7e3ff" stroke-width="1.4"/>
</svg>
